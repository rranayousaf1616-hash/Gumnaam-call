<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gumnaam Call</title>
<style>
:root{--bg:#f4f1ff;--tx:#1b1530;--mut:#6b6580;--pri:#6c4cf1;--red:#e5484d;--btn:#ece8fb}
@media (prefers-color-scheme:dark){:root{--bg:#0f0c1d;--tx:#f1eeff;--mut:#9b94b8;--btn:#2a2448}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{width:100%;max-width:420px;padding:24px;text-align:center}
.screen{display:none;flex-direction:column;align-items:center;gap:14px}
.screen.on{display:flex}
h1{margin:0;font-size:28px}
p{margin:0;color:var(--mut);line-height:1.5}
.avatar{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#6c4cf1,#c04cf1);display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff;position:relative}
.pulse::before,.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--pri);animation:p 1.8s infinite}
.pulse::after{animation-delay:.9s}
@keyframes p{to{transform:scale(1.9);opacity:0}}
.big{background:var(--pri);color:#fff;border:0;border-radius:40px;padding:16px 34px;font-size:18px;font-weight:600;cursor:pointer}
.big:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:22px;margin-top:14px}
.cb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.cb button{width:66px;height:66px;border-radius:50%;border:0;background:var(--btn);color:var(--tx);font-size:26px;cursor:pointer}
.cb button.active{background:var(--tx);color:var(--bg)}
.cb button.end{background:var(--red);color:#fff}
.pill{border:0;background:var(--btn);color:var(--tx);border-radius:30px;padding:10px 18px;font-size:14px;cursor:pointer}
.timer{font-size:22px;font-variant-numeric:tabular-nums}
.note{font-size:12px}
.chk{display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:13px;color:var(--mut)}
.bars{display:flex;gap:4px;height:28px;align-items:center}
.bars i{width:5px;background:var(--pri);border-radius:3px;animation:b 1s infinite ease-in-out;height:8px}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}.bars i:nth-child(5){animation-delay:.6s}
@keyframes b{50%{height:26px}}
.bars.mute i{animation:none;height:6px;opacity:.4}
</style>
</head>
<body>
<div class="app">
<audio id="remote" autoplay playsinline></audio>

<div class="screen on" id="home">
  <div class="avatar">🎧</div>
  <h1>Gumnaam Call</h1>
  <p>Kisi ajnabi se voice call par baat karo. Na naam, na photo, na pehchaan.</p>
  <label class="chk"><input type="checkbox" id="age"><span>Meri umar 18 saal ya zyada hai. Main kisi ko pareshan ya gaali nahi dunga, aur apni personal jaankari share nahi karunga.</span></label>
  <button class="big" id="start" disabled>📞 Baat Shuru Karo</button>
  <p class="note" id="online"></p>
</div>

<div class="screen" id="search">
  <div class="avatar pulse">?</div>
  <h1 id="stitle">Dhoondh rahe hain…</h1>
  <p id="smsg">Ek ajnabi se connect kar rahe hain</p>
  <div class="cb"><button class="end" id="cancel">✕</button>Cancel</div>
</div>

<div class="screen" id="call">
  <div class="avatar pulse" id="av">🙂</div>
  <h1 id="name">Anonymous</h1>
  <div class="timer" id="timer">00:00</div>
  <div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="row">
    <div class="cb"><button id="mute">🎤</button><span id="mlabel">Mute</span></div>
    <div class="cb"><button id="spk" class="active">🔊</button><span id="slabel">Speaker</span></div>
    <div class="cb"><button class="end" id="end">📵</button>End</div>
  </div>
  <div class="row" style="gap:10px;margin-top:6px">
    <button class="pill" id="next">⏭ Agla Ajnabi</button>
    <button class="pill" id="report">🚩 Report</button>
  </div>
</div>
</div>

<script>
var $ = function (i) { return document.getElementById(i); };
var ws, pc, stream, cfg, muted = false, loud = true, tmr, sec = 0, pending = [], inCall = false, wantOn = false;
var names = ["Neela Badal","Chhota Tara","Sunehri Raat","Hawa","Jugnu","Pehla Panchhi","Khamosh Chand","Bheega Mausam"];
var emo = ["🙂","🦉","🌙","🦊","🐼","🌸","🦋","⭐"];

function show(id) { ["home","search","call"].forEach(function (s) { $(s).classList.toggle("on", s === id); }); }
function sig(d) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "signal", data: d })); }
function wsend(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

$("age").onchange = function () { $("start").disabled = !$("age").checked; };

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) { alert("Call ke liye mic ki permission zaroori hai."); return; }
  try { cfg = await (await fetch("/config.json")).json(); } catch (e) { cfg = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] }; }
  wantOn = true; muted = false; applyMute();
  var proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(proto + "://" + location.host);
  ws.onopen = find;
  ws.onmessage = function (e) {
    var m = JSON.parse(e.data);
    if (m.type === "online") $("online").textContent = "Abhi " + m.n + " log online hain";
    else if (m.type === "matched") onMatched(m.initiator);
    else if (m.type === "signal") onSignal(m.data);
    else if (m.type === "partner-left") { closePC(); notice("Call khatam", "Saamne wale ne call kaat di. Naya ajnabi dhoondh rahe hain…"); setTimeout(find, 1500); }
  };
  ws.onclose = function () { if (wantOn) { teardown(); alert("Server se connection toot gaya. Dobara try karo."); } };
}

function notice(t, m) { $("stitle").textContent = t; $("smsg").textContent = m; show("search"); }
function find() {
  closePC(); stopTimer();
  notice("Dhoondh rahe hain…", "Ek ajnabi se connect kar rahe hain");
  wsend({ type: "find" });
}

function newPC() {
  closePC();
  pc = new RTCPeerConnection({ iceServers: cfg.iceServers });
  stream.getTracks().forEach(function (t) { pc.addTrack(t, stream); });
  pc.onicecandidate = function (e) { if (e.candidate) sig({ candidate: e.candidate }); };
  pc.ontrack = function (e) { $("remote").srcObject = e.streams[0]; applyVol(); $("remote").play().catch(function () {}); };
  pc.onconnectionstatechange = function () {
    var s = pc && pc.connectionState;
    if (s === "connected") enterCall();
    else if (s === "failed") { notice("Connect nahi hua", "Naya ajnabi dhoondh rahe hain…"); wsend({ type: "leave" }); setTimeout(find, 1200); }
  };
}

async function onMatched(initiator) {
  newPC();
  notice("Mil gaya!", "Connect ho raha hai…");
  if (initiator) {
    var o = await pc.createOffer();
    await pc.setLocalDescription(o);
    sig({ sdp: pc.localDescription });
  }
}

async function onSignal(d) {
  if (!pc) return;
  try {
    if (d.sdp) {
      await pc.setRemoteDescription(d.sdp);
      for (var i = 0; i < pending.length; i++) await pc.addIceCandidate(pending[i]).catch(function () {});
      pending = [];
      if (d.sdp.type === "offer") {
        var a = await pc.createAnswer();
        await pc.setLocalDescription(a);
        sig({ sdp: pc.localDescription });
      }
    } else if (d.candidate) {
      if (pc.remoteDescription) await pc.addIceCandidate(d.candidate).catch(function () {});
      else pending.push(d.candidate);
    }
  } catch (e) { console.error(e); }
}

function enterCall() {
  if (inCall) return;
  inCall = true;
  var i = Math.floor(Math.random() * names.length);
  $("name").textContent = names[i]; $("av").textContent = emo[i];
  sec = 0; $("timer").textContent = "00:00";
  clearInterval(tmr);
  tmr = setInterval(function () {
    sec++;
    $("timer").textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
  }, 1000);
  show("call");
}

function closePC() { inCall = false; pending = []; if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; } $("remote").srcObject = null; }
function stopTimer() { clearInterval(tmr); }
function teardown() {
  wantOn = false; closePC(); stopTimer();
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  show("home");
}

function applyMute() {
  $("mute").textContent = muted ? "🔇" : "🎤";
  $("mute").classList.toggle("active", muted);
  $("mlabel").textContent = muted ? "Unmute" : "Mute";
  $("bars").classList.toggle("mute", muted);
  if (stream) stream.getAudioTracks().forEach(function (t) { t.enabled = !muted; });
}
function applyVol() { $("remote").volume = loud ? 1 : 0.3; }

$("start").onclick = start;
$("mute").onclick = function () { muted = !muted; applyMute(); };
$("spk").onclick = function () {
  loud = !loud; applyVol();
  $("spk").textContent = loud ? "🔊" : "🔈";
  $("spk").classList.toggle("active", loud);
  $("slabel").textContent = loud ? "Speaker" : "Dheema";
};
$("end").onclick = function () { wsend({ type: "leave" }); teardown(); };
$("cancel").onclick = function () { wsend({ type: "leave" }); teardown(); };
$("next").onclick = function () { find(); };
$("report").onclick = function () {
  if (confirm("Is ajnabi ko report karke call khatam karein?")) {
    wsend({ type: "report", reason: "user-report" });
    notice("Report ho gaya", "Naya ajnabi dhoondh rahe hain…");
    setTimeout(find, 1200);
  }
};
</script>
</body>
</html>
